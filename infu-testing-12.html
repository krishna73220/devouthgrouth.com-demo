<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Reels Grid (Iframe)</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .reel-box {
      width: 100%;
      height: 420px;
      /* यहां video + username तक दिखेगा */
      overflow: hidden;
      /* नीचे का हिस्सा कट जाएगा */
      border-radius: 10px;
      position: relative;
    }

    .reel-box iframe {
      width: 100%;
      height: 600px;
      /* बड़ा रखो ताकि cropping हो सके */
      margin-top: 0;
      /* 0 मतलब header पूरा दिखेगा */
      border: 0;
    }
    iframe .Header{
      background: black !important;
    }
  </style>
  <link rel="stylesheet" href="https://graph.facebook.com/v11.0/instagram_oembed?url=https://www.instagram.com/reel/DDyOBTyyRTX/&omitscript=true
">
</head>

<body>
  <div class="container mt-4">
    <div class="row g-3">
      <!-- Box 1 -->
      <div style="background:black; padding:10px; display:inline-block; border-radius:10px;">
        <iframe src="https://www.instagram.com/reel/DDyOBTyyRTX/embed" allowfullscreen width="400" height="500"
          frameborder="0" style="background:white; border-radius:10px;">
        </iframe>
      </div>


      <!-- Box 2 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="reel-box">
          <iframe src="https://www.instagram.com/reel/DI1Epddh-du/embed" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Box 3 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="reel-box">
          <iframe src="https://www.instagram.com/reel/DI6PnncJ5xj/embed" allowfullscreen></iframe>
        </div>
      </div>

      <!-- Box 4 -->
      <div class="col-12 col-md-6 col-lg-3">
        <div class="reel-box">
          <iframe src="https://www.instagram.com/reel/DDyOBTyyRTX/embed" allowfullscreen></iframe>
        </div>
      </div>

    </div>
  </div>
</body>

</html>
