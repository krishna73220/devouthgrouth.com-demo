    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const url = "https://krishna73220.github.io/devouthgrouth.com-demo/kk1.pdf";
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

        const container = document.getElementById("pdf-container");
        const leadModal = new bootstrap.Modal(document.getElementById("leadModal"));

        pdfjsLib.getDocument(url).promise.then(function (pdf) {
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(function (page) {
                    const viewport = page.getViewport({ scale: 1.2 });
                    const canvas = document.createElement("canvas");
                    const context = canvas.getContext("2d");
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    // ✅ Sirf first page ko clickable + pointer banaye
                    if (pageNum === 1) canvas.classList.add("first-page");

                    container.appendChild(canvas);

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };

                    page.render(renderContext).promise.then(() => {
                        if (pageNum === 1) {
                            canvas.addEventListener("click", () => {
                                leadModal.show();
                            });
                        }
                    });
                });
            }
        });

        document.getElementById("leadForm").addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Form Submitted Successfully!");
            leadModal.hide();
        });
    </script>
