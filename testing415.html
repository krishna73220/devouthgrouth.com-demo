<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Bihar Pradesh Congress Committee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url("https://biharpcc.org/images/banner.webp") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .thankyou-card {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      border-radius: 25px;
      padding: 50px 40px;
      max-width: 550px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      animation: fadeIn 1.2s ease-in-out;
    }
    .thankyou-logo img {
      width: 200px;
      margin-bottom: 20px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-custom {
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      color: white;
      border-radius: 50px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-custom:hover {
      background: linear-gradient(to right, #ff4b2b, #ff416c);
      transform: translateY(-3px) scale(1.05);
    }
    /* Confetti Effect */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: #fff;
      top: -10px;
      animation: fall 3s linear forwards;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="thankyou-card">
    <div class="thankyou-logo">
      <img src="https://biharpcc.org/images/congress-campaign-logo-togerher.png" alt="BPCC Logo">
    </div>
    <h1 class="fw-bold mt-2">Thank You!</h1>
    <p class="mt-3 fs-5">Your support has been successfully recorded.<br>
    Together we will bring positive change to Bihar.</p>
    <a href="index.html" class="btn btn-custom mt-3">Go Back to Home</a>
  </div>

  <script>
    // Confetti Animation
    function createConfetti() {
      const confetti = document.createElement('div');
      confetti.classList.add('confetti');
      confetti.style.left = Math.random() * 100 + 'vw';
      confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
      confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 3000);
    }
    setInterval(createConfetti, 100);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
